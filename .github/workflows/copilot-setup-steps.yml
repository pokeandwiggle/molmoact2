name: Copilot Setup Steps

on: workflow_dispatch

jobs:
  # Job name is load-bearing: Copilot's coding agent only runs a job named
  # exactly `copilot-setup-steps` to prepare its sandbox before a session.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Not lfs: true. Forking a repo copies LFS pointer files but not the
      # underlying objects into the fork's own LFS store, so this fork has
      # none -- an LFS-enabled checkout 404s fetching every tracked object
      # (experiments/lerobot/tests/artifacts/...), even for a diff that
      # never touches them. Plain checkout leaves those paths as pointer
      # text, which is fine: nothing under review depends on their content.
      - name: Checkout code
        uses: actions/checkout@v4
